{% extends "base.html" %}

{% block title %}
    Check In Member
{% endblock %}

{% block content %}

<div class="max-w-xl mx-auto">

    <div class="card bg-base-100 shadow-xl">

        <div class="card-body">

            <div class="mb-6">

                <div class="text-4xl text-primary mb-3">
                    🟢
                </div>

                <h1 class="text-2xl font-bold">
                    Check In Member
                </h1>

                <p class="text-base-content/60 mt-1">
                    Record today's gym attendance.
                </p>

            </div>


            <form method="post" class="space-y-5">

                {% csrf_token %}


                <div>

                    <label class="label">

                        <span class="label-text font-medium">
                            Member
                        </span>

                    </label>

                    {{ form.member }}

                    {% if form.member.errors %}

                        <div class="text-error text-sm mt-1">
                            {{ form.member.errors }}
                        </div>

                    {% endif %}

                </div>


                <div class="flex gap-3 pt-3">

                    <button
                        type="submit"
                        class="btn btn-primary flex-1"
                    >
                        🟢 Check In
                    </button>

                    <a
                        href="{% url 'attendance:dashboard' %}"
                        class="btn btn-ghost"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
