<header class="sticky top-0 z-30 flex h-16 items-center border-b border-base-300 bg-base-100/95 backdrop-blur">

    <div class="flex w-full items-center justify-between px-4 lg:px-6">

        <!-- Mobile menu -->
        <div class="flex items-center gap-3">

            <label
                for="main-drawer"
                class="btn btn-square btn-ghost lg:hidden">

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="h-6 w-6 text-primary"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor">

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M4 6h16M4 12h16M4 18h16"/>

                </svg>

            </label>


            <div class="lg:hidden">

                <span class="font-bold">
                    Fitness CRM
                </span>

            </div>

        </div>


        <!-- Right side -->
        <div class="flex items-center gap-2">

            <!-- Theme Toggle -->
            <button
                type="button"
                onclick="toggleTheme()"
                class="btn btn-ghost btn-circle"
                title="Toggle theme">

                <!-- Sun -->
                <svg
                    id="sun-icon"
                    xmlns="http://www.w3.org/2000/svg"
                    class="hidden h-5 w-5"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor">

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364-.707.707M6.343 17.657l-.707.707m12.728 0-.707-.707M6.343 6.343l-.707-.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>

                </svg>


                <!-- Moon -->
                <svg
                    id="moon-icon"
                    xmlns="http://www.w3.org/2000/svg"
                    class="h-5 w-5 text-primary"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor">

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>

                </svg>

            </button>

            <!-- Notification -->
            <button class="btn btn-ghost btn-circle">

                <div class="indicator">

                    <span class="indicator-item badge badge-primary badge-xs"></span>

                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        class="h-5 w-5"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor">

                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>

                    </svg>

                </div>

            </button>


            <!-- User -->
            <div class="dropdown dropdown-end">

                <div
                    tabindex="0"
                    role="button"
                    class="btn btn-ghost">

                    <div class="avatar placeholder">

                        <div class="w-9 rounded-full bg-primary text-primary-content">

                            <span>
                                A
                            </span>

                        </div>

                    </div>

                    <div class="hidden text-left sm:block">

                        <p class="text-sm font-semibold">
                            Admin
                        </p>

                        <p class="text-xs text-base-content/60">
                            Administrator
                        </p>

                    </div>

                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        class="h-4 w-4"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor">

                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M19 9l-7 7-7-7"/>

                    </svg>

                </div>


                <ul
                    tabindex="0"
                    class="menu dropdown-content z-[1] mt-3 w-52 rounded-box bg-base-100 p-2 shadow-lg border border-base-300">

                    <li>
                        <a href="#">
                            👤 Profile
                        </a>
                    </li>

                    <li>
                        <a href="#">
                            ⚙️ Settings
                        </a>
                    </li>

                    <li>
                        <a href="#">
                            🚪 Logout
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </div>

</header>
